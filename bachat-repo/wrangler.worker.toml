# Cloudflare Workers (with Static Assets + Cron) configuration
# Use this config if deploying as a Cloudflare Worker (*.workers.dev) instead of Cloudflare Pages (*.pages.dev).
# Replace database_id below with your real D1 Database ID before deploying.

name = "bachat"
main = "worker.js"
compatibility_date = "2025-05-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
# 12:15 UTC = 18:00 (6:00 PM) Nepal Standard Time (UTC+5:45) every Friday
crons = ["15 12 * * 5"]

