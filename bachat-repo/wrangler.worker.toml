# Cloudflare Workers (with Static Assets + Cron) configuration
# Use this config if deploying as a Cloudflare Worker (*.workers.dev) instead of Cloudflare Pages (*.pages.dev).
# Replace database_id below with your real D1 Database ID before deploying.

name = "bachat"
main = "worker.js"
compatibility_date = "2025-05-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
# :15 UTC = exact :00 Nepal Standard Time (UTC+5:45) every hour:
#  - 06:00 NPT: Morning System Health Check + hourly Admin alert if errors exist until viewed
#  - 18:00 NPT (BS 2nd Friday evening): Meeting Reminder
crons = ["15 * * * *"]

