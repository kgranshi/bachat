name = "bachat-cron"
main = "worker.js"
compatibility_date = "2025-05-01"

[triggers]
# :15 UTC = exact :00 Nepal Standard Time (UTC+5:45) every hour:
#  - 00:15 UTC (06:00 NPT): Morning System Health Check
#  - Hourly while Health Check error is unacknowledged: push ONLY to Admin
#  - 12:15 UTC (18:00 NPT) on BS 2nd Friday: Group Meeting Reminder
crons = ["15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bachat-db"
database_id = "168c2d2f-f9bb-4827-b95b-ac55a87ff8f4"
